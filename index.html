<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020617">
    <title>Holiday Movie Hub 🎬🎄</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        [hidden] { display: none !important; }

        /* Flip cards */
        .flip-card { perspective: 1200px; }
        .flip-inner { position: relative; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); transform-style: preserve-3d; }
        .flip-card.is-flipped .flip-inner { transform: rotateY(180deg); }
        .flip-face { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
        .flip-back { position: absolute; inset: 0; transform: rotateY(180deg); }

        @media (prefers-reduced-motion: reduce) {
            .flip-inner, .flip-card.is-flipped .flip-inner { transition: none; transform: none; }
            .flip-back { transform: none; opacity: 0; transition: opacity 0.2s; }
            .flip-card.is-flipped .flip-back { opacity: 1; }
        }

        /* Carousels: hide the scrollbar but keep swipe/trackpad scrolling */
        .carousel { scrollbar-width: none; }
        .carousel::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased overflow-x-hidden">

    <main id="app" class="max-w-5xl w-full mx-auto px-4 py-12 flex-grow">
        <div class="flex flex-col items-center justify-center py-32 gap-4 text-slate-500" role="status">
            <div class="w-10 h-10 rounded-full border-4 border-slate-800 border-t-slate-400 animate-spin"></div>
            <p>Unwrapping the movies…</p>
        </div>
    </main>

    <footer class="text-center py-6 text-slate-600 text-xs border-t border-slate-900">
        <p>Made with ❤️ for Christmas • Handpicked recommendations</p>
    </footer>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
